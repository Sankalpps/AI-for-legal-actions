services:
  # ─── 1. Backend (FastAPI Web Service) ──────────────────────────────
  - type: web
    name: lexai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Cost controls
      - key: DAILY_AI_CALL_LIMIT
        value: "300"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      # Set to your deployed frontend URL to stop other sites calling this API
      - key: ALLOWED_ORIGINS
        value: "*"

  # ─── 2. Frontend (React / Vite Web Service) ─────────────────────────
  - type: web
    name: lexai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://lexai-backend-2gwi.onrender.com
